<style>

  .mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:18px}

  .links{display:flex;flex-wrap:wrap;gap:8px}a{display:inline-block;border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg);text-decoration:none;font-size:14px}
